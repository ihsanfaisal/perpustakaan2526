<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Perpustakaan</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Admin Perpustakaan</h1>

    <h2>Daftar Buku</h2>

    <div class="container">
      <a href="tambah.html" class="button">Tambah Buku</a>
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>Judul Buku</th>
            <th>Penulis</th>
            <th>Penerbit</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tabelData"></tbody>
      </table>
    </div>

    <a href="#" class="btn" id="logout">keluar</a>

    <script src="auth.js"></script>
    <script type="module">
      import { logout, daftarBuku } from './main.js'

      const logoutLink = document.getElementById('logout')
      logoutLink.addEventListener('click', (e) => {
        e.preventDefault()
        logout()
      })

      // Tampilkan daftar buku saat halaman dimuat
      daftarBuku()
    </script>
  </body>
</html>
